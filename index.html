<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KPOP LIVE GAME</title>

<style>

body{
background:linear-gradient(135deg,#ff0050,#6c2cff,#111);
font-family:Segoe UI;
margin:0;
color:white;
}

.container{
width:1300px;
max-width:95%;
margin:auto;
padding:20px;
}

.mode{
display:flex;
gap:10px;
margin-bottom:20px;
}

.mode button{
padding:15px 30px;
cursor:pointer;
border:none;
border-radius:15px;
font-weight:bold;
}

.tab{
display:none;
}

.active{
display:block;
}

.card{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:25px;
backdrop-filter:blur(20px);
}

input{
width:100%;
padding:15px;
border-radius:15px;
border:none;
margin:10px 0;
}

.spinBtn{
background:#00f2ea;
padding:15px 40px;
font-size:20px;
border:none;
border-radius:15px;
cursor:pointer;
}

.photo{
width:300px;
height:400px;
margin:auto;
overflow:hidden;
border-radius:20px;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

.result{
font-size:22px;
line-height:1.8;
margin-top:20px;
}

#wheel{
display:block;
margin:auto;
transition:transform 5s ease-out;
}

.zonk{
animation:flash .2s infinite;
}

@keyframes flash{
0%{background:red;}
50%{background:black;}
100%{background:red;}
}

</style>
</head>
<body>

<div class="container">

<div class="mode">

<button onclick="showTab('match')">
💖 MATCH IDOL
</button>

<button onclick="showTab('spin')">
🎡 SPIN IDOL
</button>

</div>

<!-- MATCH -->

<div id="match" class="tab active card">

<h2>💖 Match Idol Korea</h2>

<input
id="namaMatch"
placeholder="Masukkan Nama">

<button
class="spinBtn"
onclick="idolMatch()">

MATCH
</button>

<div class="photo">

<img
id="matchPhoto"
src="">

</div>

<div
class="result"
id="matchResult">
</div>

</div>

<!-- SPIN -->

<div id="spin" class="tab card">

<h2>🎡 Spin Idol Korea</h2>

<canvas
id="wheel"
width="600"
height="600">
</canvas>


<button
class="spinBtn"
onclick="spinWheel()">

SPIN SEKARANG
</button>

<div class="photo">

<img
id="spinPhoto"
src="">

</div>

<div
class="result"
id="spinResult">
</div>

</div>

</div>

function rand(arr){
return arr[
Math.floor(Math.random()*arr.length)
];
}

function showTab(id){

document
.querySelectorAll('.tab')
.forEach(x=>x.classList.remove('active'));

document
.getElementById(id)
.classList.add('active');

}

function idolMatch(){

let nama =
document
.getElementById('namaMatch')
.value;

let idol =
rand(idols);

let match =
70 + Math.floor(Math.random()*31);

document
.getElementById('matchPhoto')
.src=idol.photo;

document
.getElementById('matchResult')
.innerHTML=`

<h2 style="font-size:40px;color:#00f2ea">

💖 ${idol.name}

</h2>

<hr>

<p>
👤 <b>${nama}</b>
</p>

<p>
💖 Compatibility :
<b>${match}%</b>
</p>

<p>
✅ Kelebihan Utama
<br><br>
${rand(greenFlags)}
</p>

<p>
⚠ Tantangan Hubungan
<br><br>
${rand(redFlags)}
</p>

<p>
😎 Kepribadian
<br><br>
${rand(personalities)}
</p>

<p>
📝 Profil Pasangan
<br><br>
${rand(descriptions)}
</p>

`;

}

const canvas=
document.getElementById('wheel');

const ctx=
canvas.getContext('2d');

const total=12;

const arc=
(2*Math.PI)/total;

for(let i=0;i<total;i++){

ctx.beginPath();

ctx.moveTo(300,300);

ctx.fillStyle=
i%2
?"#ff0050"
:"#00f2ea";

ctx.arc(
300,
300,
280,
arc*i,
arc*(i+1)
);

ctx.fill();

}

let rot=0;

function spinWheel(){

let zonkChance=
Math.random();

let result;

if(zonkChance<0.05){

result={
name:rand(zonks),
photo:""
};

document.body.classList.add('zonk');

setTimeout(()=>{
document.body.classList.remove('zonk');
},3000);

}else{

result=
rand(idols);

}

rot +=
7200+
Math.random()*1440;

canvas.style.transform=
`rotate(${rot}deg)`;

setTimeout(()=>{

if(result.photo){

document
.getElementById('spinPhoto')
.src=result.photo;

}

let match =
70 + Math.floor(Math.random()*31);

let visual =
90 + Math.floor(Math.random()*11);

let popularity =
90 + Math.floor(Math.random()*11);

.getElementById('spinResult')
.innerHTML=`
